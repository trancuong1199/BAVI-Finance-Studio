    <ellipse cx="335" cy="120" rx="4" ry="7" fill="#0c2040" />

    <!-- Front Legs -->
    <path d="M 300 168 C 310 185 325 200 340 205 C 320 215 305 220 290 195" fill="none" stroke="#0c2040" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 275 180 C 285 200 295 215 310 220 C 295 230 280 230 270 210" fill="none" stroke="#0c2040" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Tail & Back Leg -->
    <path d="M 150 160 C 120 180 80 190 50 175 C 80 210 120 215 155 190 L 140 230 C 130 250 115 260 105 270" fill="none" stroke="#0c2040" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner Cyan Arrow Loop -->
    <path d="M 175 195 C 160 165 175 135 210 135 C 245 135 260 160 250 185 L 265 170 M 250 185 L 235 175" fill="none" stroke="url(#baviArrowGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 180 190 C 190 220 225 225 250 200" fill="none" stroke="url(#baviArrowGrad)" stroke-width="12" stroke-linecap="round" />
